<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Card Body Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Buy (Green) Gradient -->
    <linearGradient id="buyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Sell (Red/Rose) Gradient -->
    <linearGradient id="sellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Tech Blue Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Base Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Main Ledger Blotter Board -->
  <g filter="url(#shadow)">
    <rect x="96" y="88" width="320" height="336" rx="24" fill="url(#cardGrad)" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Blotter Terminal Header -->
  <path d="M 96 112 C 96 98.7 106.7 88 120 88 L 392 88 C 405.3 88 416 98.7 416 112 L 416 144 L 96 144 Z" fill="#1E293B"/>
  <line x1="96" y1="144" x2="416" y2="144" stroke="#334155" stroke-width="2"/>

  <!-- Terminal Header Status Dots -->
  <circle cx="126" cy="116" r="5" fill="#EF4444" opacity="0.9"/>
  <circle cx="144" cy="116" r="5" fill="#F59E0B" opacity="0.9"/>
  <circle cx="162" cy="116" r="5" fill="#10B981" opacity="0.9"/>

  <!-- Header Blotter Column Labels -->
  <rect x="294" y="110" width="42" height="12" rx="6" fill="#38BDF8" fill-opacity="0.25"/>
  <rect x="346" y="110" width="42" height="12" rx="6" fill="#64748B" fill-opacity="0.3"/>

  <!-- Trade Record 1: BUY Execution -->
  <rect x="122" y="170" width="36" height="36" rx="10" fill="url(#buyGrad)" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
  <path d="M 140 181 L 140 195 M 140 181 L 134 187 M 140 181 L 146 187" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Row 1 Data Bars -->
  <rect x="174" y="176" width="94" height="10" rx="5" fill="#F8FAFC"/>
  <rect x="174" y="192" width="58" height="8" rx="4" fill="#64748B"/>
  <!-- Row 1 Value Pill -->
  <rect x="312" y="178" width="76" height="20" rx="6" fill="#10B981" fill-opacity="0.2"/>
  <rect x="322" y="185" width="56" height="6" rx="3" fill="#34D399"/>

  <!-- Divider 1 -->
  <line x1="122" y1="226" x2="388" y2="226" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Trade Record 2: SELL Execution -->
  <rect x="122" y="244" width="36" height="36" rx="10" fill="url(#sellGrad)" fill-opacity="0.15" stroke="#F43F5E" stroke-width="1.5"/>
  <path d="M 140 271 L 140 257 M 140 271 L 134 265 M 140 271 L 146 265" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Row 2 Data Bars -->
  <rect x="174" y="250" width="112" height="10" rx="5" fill="#F8FAFC"/>
  <rect x="174" y="266" width="72" height="8" rx="4" fill="#64748B"/>
  <!-- Row 2 Value Pill -->
  <rect x="312" y="252" width="76" height="20" rx="6" fill="#F43F5E" fill-opacity="0.2"/>
  <rect x="322" y="259" width="56" height="6" rx="3" fill="#FB7185"/>

  <!-- Divider 2 -->
  <line x1="122" y1="300" x2="388" y2="300" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Trade Record 3: SETTLED / FILLED Order -->
  <rect x="122" y="318" width="36" height="36" rx="10" fill="url(#accentGrad)" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5"/>
  <path d="M 132 336 L 138 342 L 148 330" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Row 3 Data Bars -->
  <rect x="174" y="324" width="82" height="10" rx="5" fill="#F8FAFC"/>
  <rect x="174" y="340" width="50" height="8" rx="4" fill="#64748B"/>
  <!-- Row 3 Value Pill -->
  <rect x="312" y="326" width="76" height="20" rx="6" fill="#38BDF8" fill-opacity="0.2"/>
  <rect x="322" y="333" width="56" height="6" rx="3" fill="#38BDF8"/>

  <!-- Floating Execution Badge Accent -->
  <g filter="url(#shadow)">
    <circle cx="396" cy="380" r="28" fill="url(#accentGrad)"/>
    <path d="M 387 380 L 405 380 M 399 374 L 405 380 L 399 386" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="396" cy="380" r="28" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>
</svg>
